name: BI ETL

on:
  schedule:
    - cron: "*/5 * * * *"  # a cada 5 minutos (UTC)
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: bi-etl
      cancel-in-progress: false

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
      MONGODB_TELEMETRY_URI: ${{ secrets.MONGODB_TELEMETRY_URI }}
      MONGO_DB_TELEMETRY: ${{ secrets.MONGO_DB_TELEMETRY }}
      MONGODB_APP_URI: ${{ secrets.MONGODB_APP_URI }}
      MONGO_DB_APP: ${{ secrets.MONGO_DB_APP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar ETL
        run: python bi_etl.py