name: BI ETL

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    env:
      SECOND_YEAR_DB_HOST: ${{ secrets.DB_HOST }}
      SECOND_YEAR_DB_PORT: ${{ secrets.DB_PORT }}
      SECOND_YEAR_DB_NAME: ${{ secrets.DB_NAME }}
      SECOND_YEAR_DB_USER: ${{ secrets.DB_USER }}
      SECOND_YEAR_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SECOND_YEAR_DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar ETL
        run: python bi_etl.py
