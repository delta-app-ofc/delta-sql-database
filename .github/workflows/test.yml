name: Testes PostgreSQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Executar smoke test
        run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from smoke
      - name: Remover contêineres
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - smoke
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@bf223d513c7fc59b02a67626c91171368b9ceffa
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
